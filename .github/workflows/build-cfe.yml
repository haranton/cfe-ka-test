name: Проверка сборки расширения

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onec-test-base
  cancel-in-progress: false
  queue: max

jobs:
  build_1c:
    name: build_1c
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      VRUNNER_IBCONNECTION: ${{ vars.ONEC_TEST_CONNECTION }}
      VRUNNER_DBUSER: ${{ secrets.ONEC_DB_USER }}
      VRUNNER_DBPWD: ${{ secrets.ONEC_DB_PASSWORD }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Получить коммит
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Проверить подключение к тестовой базе
        run: |
          $config = Get-Content autumn-properties.json -Encoding UTF8 -Raw | ConvertFrom-Json
          if (-not ($env:VRUNNER_IBCONNECTION -or $config.vrunner.ibconnection)) {
            throw 'Set vrunner.ibconnection or Actions Variable ONEC_TEST_CONNECTION'
          }
      - name: Проверить возможность применения расширения
        run: |
          $config = Get-Content autumn-properties.json -Encoding UTF8 -Raw | ConvertFrom-Json
          vrunner infobase extensions check $config.vrunner.'extension-name'

      - name: Загрузить и обновить расширение
        run: vrunner cfe load



